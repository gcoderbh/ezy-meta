<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ezy-Meta System Architecture — Editorial Diagram</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card-bg: #161b22;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #00ff66;
      --border: #30363d;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1120px;
      width: 100%;
    }
    header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 400;
      margin: 0;
      color: #fff;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      background: rgba(0, 255, 102, 0.12);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      letter-spacing: 0.08em;
    }
    .diagram-wrapper {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
      overflow-x: auto;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .meta-footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Ezy-Meta System Architecture</h1>
        <p style="margin: 4px 0 0 0; color: var(--muted); font-size: 0.9rem;">
          Full-Stack Meta AI Image-to-Video Bridge • CLI • WebSocket RPC • Chrome Extension MV3 • Pure JS Evaluator
        </p>
      </div>
      <div>
        <span class="badge">SPEC: DIAGRAM-DESIGN 2.6</span>
      </div>
    </header>

    <div class="diagram-wrapper">
      <!-- Embedded SVG -->
      <object type="image/svg+xml" data="architecture.svg" width="100%" height="auto"></object>
    </div>

    <div class="meta-footer">
      <span>Zero External Dependencies • No Shadows • Orthogonal Elbow Connectors</span>
      <span>Target Density: 4/10 • Focal Accent: Quality Engine</span>
    </div>
  </div>
</body>
</html>
